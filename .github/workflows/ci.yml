name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Production dependencies only; moderate advisories are tracked, high fail the build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  migrations:
    name: Migrations and seeds apply cleanly
    runs-on: ubuntu-latest
    services:
      mysql:
        # 8.0 (not 8.4) because GitHub service containers cannot pass mysqld
        # flags, and 8.0 still ships mysql_native_password enabled for Synor.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: node_express_boilerplate_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_NAME: node_express_boilerplate_ci
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Enable mysql_native_password for Synor's driver
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'root'; FLUSH PRIVILEGES;"
      - name: Apply all migrations (do)
        run: npm run mg:latest
      - name: Seed reference data
        run: npm run seed
      - name: Roll every migration back (undo) and re-apply
        run: |
          npx synor migrate --config=.synorrc.cjs 000000000000 --outOfOrder
          npm run mg:latest

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: GIT_COMMIT=${{ github.sha }}
