# Host ports 3307 / 6380 on purpose: 3306 and 6379 are usually taken by other
# local containers. Match them in .env.local (DATABASE_PORT / REDIS_URL).
# Local infrastructure only — the API itself runs with `npm run dev` on the
# host so tsx watch and the debugger work. `docker compose up -d`, then
# `npm run mg:latest && npm run seed`.
services:
  mysql:
    image: mysql:8.4
    container_name: node-express-boilerplate-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      # Synor's migration driver needs the legacy auth plugin (see docker/mysql-init)
      - --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-root}
      MYSQL_DATABASE: ${DATABASE_NAME:-node_express_boilerplate}
    ports:
      - '${DATABASE_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${DATABASE_PASSWORD:-root}',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: node-express-boilerplate-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
